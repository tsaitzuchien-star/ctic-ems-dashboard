        // ==========================================
        async function fetchPowerData() {
            const statusIndicator = document.getElementById('statusText');
            try {
                const res = await fetch(LIVE_URL + "?t=" + Date.now(), { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                liveData = await res.json();
                const age = (Date.now() - new Date(liveData.updated.replace(' ', 'T') + ':00+08:00')) / 60000;
                const stale = age > 60;
                statusIndicator.innerHTML = `<i class="fa-solid ${stale ? 'fa-triangle-exclamation' : 'fa-cloud-arrow-down'} mr-1"></i> 資料時間 ${liveData.updated}${stale ? '（超過 1 小時未更新）' : ''}`;
                statusIndicator.className = `text-sm ${stale ? 'text-amber-400' : 'text-emerald-400'} mt-1 font-mono`;
                if (currentTab === 'Live' || currentTab === 'EM') renderCards();
            } catch (error) {
                console.error("抓取資料失敗:", error);
                statusIndicator.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1 text-red-400"></i> 即時資料連線失敗';
                statusIndicator.className = "text-sm text-red-400 mt-1 font-mono";
            }
        }

        // ==========================================
        // 核心邏輯：解析字串並計算用電 (全格式相容防呆版)
        // ==========================================
        // 房間卡片：各迴路 [最近15分kW, 今日kWh, 本月kWh]，來自 rooms.json
        const ROOMS_URL = EMS_LOCAL ? "/api/ems/rooms.json" : "https://raw.githubusercontent.com/tsaitzuchien-star/Smart-Energy-Dashboard/ems-live/rooms.json";
        const PANEL_ALIAS = { 'EP3D_1': 'EP3D_1_B' };   // 網站盤名 → 監控標籤盤名
        let roomsUpdated = null;
        let roomsFcu = {};   // 本機版才有：各房間小型送風機 [運轉台數, 台數, 平均室溫, 運轉中平均設定溫度]

        function circuitKey(part) {
            const m = part.trim().match(/^(.+?)\s*\((\d+)迴?\)$/);
            if (!m) return null;
            let panel = m[1].trim().replace(/-/g, '_');
            panel = PANEL_ALIAS[panel] || panel;
            return `${panel}_${parseInt(m[2], 10)}`;
        }

        // 這幾個盤在監控電腦上沒有分路電表，只有整盤的總表（rooms.json 的 "#盤名"）
        const NO_BRANCH = { 'ATS1_3': '#ATS_1_3', 'ER2A_1': '#ER2A', 'PB1A': '#PB1A', 'EACMP_1': '#EACMP_1' };
        const panelOf = key => key.replace(/_\d+$/, '');

        // 房間迴路表的索引：所有迴路、配電盤、各用途、每個盤由哪些空間使用
        let _cidx = null;
        function circuitIndex() {
            if (_cidx) return _cidx;
            const all = new Set(), byCat = {}, users = {};
            CATS.forEach(c => byCat[c] = new Set());
            roomData.forEach(r => Object.entries(r.circuits).forEach(([cat, cs]) => {
                if (!cs || cs === '-') return;
                cs.split(' / ').forEach(c => {
                    const k = circuitKey(c);
                    if (!k) return;
                    all.add(k); (byCat[cat] = byCat[cat] || new Set()).add(k);
                    const p = panelOf(k); (users[p] = users[p] || new Set()).add(r.room_id);
                });
            }));
            const panels = new Set([...all].map(panelOf));
            return _cidx = { all, byCat, users, panels };
        }

        function updateHeader() {
            const idx = circuitIndex();
            const set = (id, v) => { const e = document.getElementById(id); if (e) e.innerHTML = v; };
            const pub = roomData.filter(r => r.building === 'Public').length;
            set('statRooms', fmt(roomData.length));
            set('statRoomsSub', `A/B/C 棟 ${roomData.length - pub} · 公設機房 ${pub}`);
            const nb = [...idx.all].filter(k => NO_BRANCH[panelOf(k)]);
            set('statPanels', fmt(idx.panels.size));
            set('statCircuits', fmt(idx.all.size));
            if (!roomsUpdated) { set('statCircuitsSub', '讀取電表中…'); return; }
            const livePanels = new Set(Object.keys(livePowerData).filter(k => !k.startsWith('#')).map(panelOf));
            const metered = [...idx.all].filter(k => livePowerData[k]).length;
            set('statPanelsSub', `監控電腦共 ${livePanels.size} 盤`);
            set('statCircuitsSub', `有電表 ${fmt(metered)} · 無分路電表 ${nb.length}`);
        }

        // 沒有分路電表的盤：顯示整盤總表，並註明和哪些空間共用（不計入房間合計，避免重複）
        function noBranchHTML(circuitString, selfId) {
            const panels = [...new Set(circuitString.split(' / ').map(circuitKey).filter(k => k && NO_BRANCH[panelOf(k)]).map(panelOf))];
            if (!panels.length) return null;
            return panels.map(p => {
                const v = livePowerData[NO_BRANCH[p]];
                const others = [...(circuitIndex().users[p] || [])].filter(x => x !== selfId);
                const share = others.length ? `與 ${others.slice(0, 3).join('、')}${others.length > 3 ? ' 等' : ''} 共用` : '';
                return `<div class="flex flex-col items-end leading-tight" title="${p.replace(/_/g, '-')} 盤沒有分路電表，這裡是整盤總表，不計入本空間合計">
                    <span class="text-amber-300 text-xs font-bold"><i class="fa-solid fa-circle-info mr-1"></i>${p.replace(/_/g, '-')} 無分路電表</span>
                    <span class="text-slate-400 text-[10px]">${v ? `整盤本月 ${v[2] != null ? v[2].toFixed(1) : '—'} kWh · 目前 ${(v[0] || 0).toFixed(1)} kW` : '整盤總表讀取中'}${share ? ' · ' + share : ''}</span></div>`;
            }).join('');
        }

        // 一個用途（例如「插座」）的所有迴路加總；回傳 null 表示沒有任何迴路有資料
        function sumCircuits(circuitString) {
            if (!circuitString || circuitString === '-') return null;
            let kw = 0, today = 0, month = 0, night = 0, work = 0, hasNight = false, hasWork = false, found = 0, total = 0;
            circuitString.split(' / ').forEach(c => {
                const key = circuitKey(c);
                if (!key || NO_BRANCH[panelOf(key)]) return;
                total++;
                const v = livePowerData[key];
                if (!v) return;
                found++;
                kw += v[0] || 0; today += v[1] || 0; month += v[2] || 0;
                if (v[3] != null) { night += v[3]; hasNight = true; }
                if (v[4] != null) { work += v[4]; hasWork = true; }
            });
            return found ? { kw, today, month, night: hasNight ? night : null, work: hasWork ? work : null, found, total } : null;
        }

        function calculateKwh(circuitString) {
            const s = sumCircuits(circuitString);
            if (!s) return circuitString;
            const partial = s.found < s.total ? `<span class="text-amber-400" title="部分迴路沒有監測資料">（${s.found}/${s.total} 迴）</span>` : '';
            return `<div class="flex flex-col items-end leading-tight">
                <span class="text-emerald-400 font-bold text-base" title="本月累計">${s.month.toFixed(1)} <span class="text-[10px] font-normal">kWh 本月</span></span>
                <span class="text-slate-400 text-[10px]">今日 ${s.today.toFixed(1)} kWh · 目前 ${s.kw.toFixed(1)} kW ${partial}</span></div>`;
        }

        // 同一房間內重複列出的迴路只算一次
        function roomTotals(room) {
            const keys = new Set();
            Object.values(room.circuits).forEach(cs => (cs && cs !== '-') && cs.split(' / ').forEach(c => { const k = circuitKey(c); if (k && !NO_BRANCH[panelOf(k)]) keys.add(k); }));
            let kw = 0, today = 0, month = 0, night = null, work = null, any = false;
            keys.forEach(k => {
                const v = livePowerData[k];
                if (!v) return;
                any = true; kw += v[0] || 0; today += v[1] || 0; month += v[2] || 0;
                if (v[3] != null) night = (night || 0) + v[3];
                if (v[4] != null) work = (work || 0) + v[4];
            });
            return any ? { kw, today, month, night, work } : null;
        }

        // 用電密度：1 坪 = 3.3058 m²
        const PING_M2 = 3.3058;
        const wPerM2 = (kw, ping) => ping > 0 ? kw * 1000 / (ping * PING_M2) : null;
        const kwhPerPing = (kwh, ping) => ping > 0 ? kwh / ping : null;
        const OFF_HOURS = 510;   // 一個月約 730 小時，扣掉 22 個工作天 × 10 小時上班 ≈ 510 小時下班時間
        const median = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

        // 歷史月用電：中創服務部「園區空間每月用電表」（2023/1 起），由 data/monthly.json 提供
        let monthly = null;
        // 優先讀每天自動更新的 ems-monthly 分支；讀不到才用網站內附的備份
        const MONTHLY_URLS = EMS_LOCAL ? ["data/monthly.json"] : ["https://raw.githubusercontent.com/tsaitzuchien-star/Smart-Energy-Dashboard/ems-monthly/monthly.json", "data/monthly.json"];
        async function fetchMonthly() {
            for (const url of MONTHLY_URLS) {
                try {
                    const res = await fetch(url, { cache: 'no-cache' });
                    if (res.ok) { monthly = await res.json(); renderCards(); return; }
                } catch (e) { console.warn('歷史月用電讀取失敗', url, e); }
            }
        }
        // 台電帳單：南區服務組「南區用電資料.xlsx」中創部分，每天整理成 bill.json（含同仁填寫檢查）
        let bill = null;
        const BILL_URLS = EMS_LOCAL ? ["data/bill.json"] : ["https://raw.githubusercontent.com/tsaitzuchien-star/Smart-Energy-Dashboard/ems-monthly/bill.json", "data/bill.json"];
        async function fetchBill() {
            for (const url of BILL_URLS) {
                try {
                    const res = await fetch(url, { cache: 'no-cache' });
                    if (res.ok) { bill = await res.json(); if (currentTab === 'EM') renderCards(); return; }
                } catch (e) { console.warn('台電帳單讀取失敗', url, e); }
            }
        }
        const sum = a => a.reduce((x, y) => x + (y || 0), 0);
        // 近 12 個月與前 12 個月
        function last12(series) {
            const n = series.length, cur = sum(series.slice(n - 12)), prev = n >= 24 ? sum(series.slice(n - 24, n - 12)) : null;
            return { cur, prev, chg: prev >= 500 ? (cur - prev) / prev * 100 : null };   // 前一年幾乎沒用電（新進駐）時不算百分比
        }
        function sparkline(vals, w = 120, h = 28) {
            const max = Math.max(...vals, 1);
            const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(' ');
            return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="inline-block align-middle"><polyline points="${pts}" fill="none" stroke="#38bdf8" stroke-width="1.5"/></svg>`;
        }
        function historyLine(room) {
            const v = monthly && monthly.rooms[room.room_id];
            if (!v || sum(v) <= 0) return '';
            const l = last12(v), m = monthly.months;
            const chg = l.chg === null ? '' : `<span class="${l.chg > 0 ? 'text-red-400' : 'text-emerald-400'}">${l.chg > 0 ? '▲' : '▼'}${fmt(Math.abs(l.chg))}%</span>`;
            return `<div class="flex items-center justify-between gap-2 text-xs text-slate-400 mb-3 font-mono" title="${m[0]}–${m[m.length - 1]} 每月用電（含空調分攤）">
                ${sparkline(v.slice(-24))}<span>近 12 月 ${fmt(l.cur)} 度 ${chg}${room.area ? `<br>${fmt(l.cur / room.area)} 度/坪·年` : ''}</span></div>`;
        }

        function fcuLine(room) {
            const f = roomsFcu[room.room_id];
            if (!f) return '';
            const [on, n, t, st] = f;
            return `<div class="flex items-center justify-between text-xs mb-3 font-mono" title="空調監控主機的小型送風機（FCU）狀態，每 5 分鐘更新">
                <span class="${on ? 'text-sky-300' : 'text-slate-500'}"><i class="fa-solid fa-fan mr-1 ${on ? 'fa-spin' : ''}" style="--fa-animation-duration:3s"></i>送風機 ${on}/${n} 台運轉</span>
                <span class="text-slate-300">室溫 ${fmt(t, 1)}°C${on && st != null ? `・設定 ${fmt(st, 1)}°C` : ''}</span></div>`;
        }

        async function fetchRooms() {
            try {
                const res = await fetch(ROOMS_URL + "?t=" + Date.now(), { cache: "no-store" });
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                livePowerData = data.circuits;
                roomsUpdated = data.updated;
                roomsFcu = data.fcu || {};
                updateHeader();
                renderCards();
            } catch (e) {
                console.error('房間資料讀取失敗', e);
            }
        }

        function lockBanner() {
            if (!roomsUpdated) return `<div class="col-span-full text-xs text-slate-500 font-mono"><i class="fa-solid fa-spinner fa-spin mr-1"></i>各房間用電資料載入中...</div>`;
            return `<div class="col-span-full text-xs text-slate-400 font-mono"><i class="fa-solid fa-cloud-arrow-down mr-1 text-emerald-400"></i>各房間用電資料時間 ${roomsUpdated}，本月＝本月 1 日（或開始記錄日）至今</div>`;
        }

        Chart.defaults.color = '#cbd5e1';
        // 繪製圓餅圖
        // 各用途對應的迴路數（同一用途內重複的迴路只算一次），由房間迴路表自動計算
        const CATS = ['插座', '照明', '空調', '動力'];
        const ctx = document.getElementById('typeChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: { labels: CATS, datasets: [{ data: CATS.map(c => circuitIndex().byCat[c].size), backgroundColor: ['#f59e0b', '#fde047', '#38bdf8', '#f87171'], borderWidth: 0, hoverOffset: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#cbd5e1', boxWidth: 10, font: {size: 10} } } }, cutout: '70%' }
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-500/20', 'text-blue-300', 'font-bold', 'border-blue-400');
                btn.classList.add('hover:bg-slate-800', 'text-slate-400', 'border-transparent');
            });
            const activeBtn = document.getElementById('tab-' + tab);
            if(activeBtn) {
                activeBtn.classList.remove('hover:bg-slate-800', 'text-slate-400', 'border-transparent');
                activeBtn.classList.add('bg-blue-500/20', 'text-blue-300', 'font-bold', 'border-blue-400');
            }
            renderCards();
        }

        // ==========================================
        // 渲染單行迴路資訊 (支援 HTML 解析)
        // ==========================================
        function renderCircuitRow(iconClass, colorClass, label, circuitStr, roomId) {
            let content = `<span class="text-xs text-slate-600 italic">無配置</span>`;
            
            if (circuitStr && circuitStr !== '-') {
                const calculatedHTML = calculateKwh(circuitStr);
                
                const nb = noBranchHTML(circuitStr, roomId);
                if (nb) {
                    content = `<span class="max-w-[75%] text-right space-y-1" title="包含迴路: ${circuitStr}">${calculatedHTML !== circuitStr ? calculatedHTML : ''}${nb}</span>`;
                } else if (calculatedHTML !== circuitStr) {
                    // 如果成功算出數字並轉為 HTML，直接顯示 (不加 badge 背景框)
                    content = `<span class="max-w-[70%] text-right font-mono" title="包含迴路: ${circuitStr}">${calculatedHTML}</span>`;
                } else {
                    // 若抓不到資料或尚未連線，維持原本的藍色 Badge 標籤
                    content = `<span class="circuit-badge truncate max-w-[65%] text-right font-mono" title="${circuitStr}">${circuitStr}</span>`;
                }
            }

            return `
            <div class="flex justify-between items-center group/item pt-1">
                <span class="text-slate-300 flex items-center text-sm font-medium"><i class="${iconClass} w-6 ${colorClass} group-hover/item:scale-110 transition"></i>${label}</span>
                ${content}
            </div>`;
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            container.innerHTML = '';
            
            liveCharts.forEach(c => c.destroy());
            liveCharts = [];
            if (currentTab === 'RT') { renderRT(container); return; }
            if (currentTab === 'Live') { renderLive(container); return; }
            if (currentTab === 'EM') { renderEM(container); return; }

            let filtered = roomData.filter(r => r.building === currentTab);
            if (query) {
                filtered = filtered.filter(r => r.room_id.toLowerCase().includes(query) || r.company.toLowerCase().includes(query));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-16"><i class="fa-solid fa-magnifying-glass-location text-5xl mb-4 block opacity-50"></i><p class="text-xl">此分頁找不到符合的空間資料</p></div>`;
                return;
            }

            container.insertAdjacentHTML('beforeend', lockBanner());
            filtered.forEach(room => {
                const tot = roomTotals(room);
                let badgeColor = "bg-slate-500/30 text-slate-300";
                if (room.type === '辦公室') badgeColor = "bg-emerald-500/30 text-emerald-300";
                if (room.type === '實驗室') badgeColor = "bg-blue-500/30 text-blue-300";
                if (room.type === '機房' || room.type === '公共空間') badgeColor = "bg-amber-500/30 text-amber-300";

                const card = `
                <div class="glass-card p-5 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 ${badgeColor} px-3 py-1.5 rounded-bl-xl text-xs font-bold shadow-sm backdrop-blur-md border-b border-l border-white/10">${room.type}</div>
                    <h2 class="text-2xl font-black mb-1 text-white group-hover:text-blue-400 transition drop-shadow-md">${room.room_id}${tot ? `<span class="text-sm font-mono font-normal text-emerald-300 ml-3" title="本房間本月合計">${tot.month.toFixed(0)} kWh</span>` : ''}</h2>
                    <p class="text-slate-400 text-sm ${room.area ? 'mb-1' : 'mb-4 pb-3 border-b border-slate-700/60'} truncate font-medium" title="${room.company}">${room.company || '<span class="italic text-slate-600">無進駐單位</span>'}</p>
                    ${room.area ? `<p class="text-xs text-slate-400 mb-4 pb-3 border-b border-slate-700/60 font-mono">${fmt(room.area, 1)} 坪${tot ? ` · <span class="text-sky-300" title="目前用電密度">${fmt(wPerM2(tot.kw, room.area), 1)} W/m²</span> · <span class="text-emerald-300" title="本月每坪用電">${fmt(kwhPerPing(tot.month, room.area), 1)} kWh/坪</span>` : ''}${tot && tot.night != null ? `<br><span class="text-violet-300" title="最近一晚 00:00–06:00 平均">夜間基載 ${fmt(tot.night, 2)} kW</span>${tot.work ? `（上班時段的 ${fmt(tot.night / tot.work * 100)}%）` : ''}` : ''}</p>` : ''}
                    
                    ${fcuLine(room)}${historyLine(room)}
                    <div class="space-y-2 mt-4">
                        ${renderCircuitRow('fa-solid fa-snowflake', 'text-blue-400', '空調', room.circuits['空調'], room.room_id)}
                        ${renderCircuitRow('fa-solid fa-plug', 'text-amber-400', '插座', room.circuits['插座'], room.room_id)}
                        ${renderCircuitRow('fa-solid fa-gears', 'text-red-400', '動力', room.circuits['動力'], room.room_id)}
                        ${renderCircuitRow('fa-regular fa-lightbulb', 'text-yellow-300', '照明', room.circuits['照明'], room.room_id)}
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        // ==========================================
        // 即時總覽（只放園區層級彙總，不放個別廠商）
        // ==========================================
        const fmt = (v, d = 0) => (v === null || v === undefined) ? '—' : Number(v).toLocaleString('zh-TW', { maximumFractionDigits: d, minimumFractionDigits: d });
        const PALETTE = ['#38bdf8', '#fbbf24', '#f87171', '#34d399', '#a78bfa', '#94a3b8'];

        function tile(label, value, unit, sub, color) {
            return `<div class="glass-card p-5 border-l-4 ${color}">
                <p class="text-slate-400 text-xs md:text-sm">${label}</p>
                <p class="text-2xl md:text-3xl font-bold text-white font-mono">${value}<span class="text-sm font-normal text-slate-400 ml-1">${unit}</span></p>
                <p class="text-xs text-slate-400 mt-1">${sub}</p></div>`;
        }

        // ==========================================
        // 即時監控（只在監控電腦本機版）：每 5 秒讀 /api/live
        // ==========================================
        let rt = null, rtCharts = [];
        async function fetchRT() {
            try {
                const res = await fetch('/api/live', { cache: 'no-store' });
                rt = await res.json();
            } catch (e) { rt = { ok: false, error: '連不到本機程式 local_live.py' }; }
            if (currentTab === 'RT') updateRT();
        }
        function rtRow(label, id, unit = '') {
            return `<div class="flex justify-between text-sm py-1 border-b border-slate-700/50"><span class="text-slate-300">${label}</span><span class="font-mono text-white"><span id="${id}">—</span>${unit ? ' ' + unit : ''}</span></div>`;
        }
        function rtBar(label, id) {
            return `<div class="py-1"><div class="flex justify-between text-sm"><span class="text-slate-300">${label}</span><span class="font-mono text-white" id="${id}">—</span></div>
                <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden mt-1"><div id="${id}-bar" class="h-2 bg-sky-400 rounded-full" style="width:0%"></div></div></div>`;
        }
        function renderRT(container) {

            container.innerHTML = `

                rtSet('rt-mhot', (typeof m.hot_share === 'number' ? fmt(m.hot_share * 100, 0) + '%' : '—') + '（' + (typeof m.fcu_on === 'number' ? m.fcu_on : 0) + ' 台運轉）');
                rtSet('rt-mlast', m.last_action ? `最近調整：${m.last_action_at.slice(11, 16)} ${m.mode === 'LIVE' ? '' : '（試跑）'}${m.last_action}` : '今天還沒有調整');
            }
            const tr = rt.ac_trend || [], col = k => keys.includes(k) ? idx(k) : -1;

            chart.data.datasets[0].data = tr.map(p => p[col('mag_chws_c')]);
            chart.data.datasets[1].data = tr.map(p => p[col('chws_target')] ?? null);
            chart.data.datasets[2].data = tr.map(p => p[col('mag_limit_pct')]);
            chart.data.datasets[3].data = tr.map(p => avg([p[idx('mag_c1_pct')], p[idx('mag_c2_pct')]]));
            chart.update('none');
        }

        function ecoFloor(dt) {
            const hm = dt.getHours() * 60 + dt.getMinutes(), wk = dt.getDay() >= 1 && dt.getDay() <= 5;
            if (!wk) return '週末 30%（人員設定）';
            if (hm >= 18 * 60 || hm < 7 * 60) return '40%（18:00 後下班時段固定）';
            const v2 = dt >= new Date('2026-11-09T00:00:00+08:00');
            return hm < 570 ? (v2 ? '75%' : '90%') + '（09:30 前）' : hm < 660 ? '65%（09:30–11:00）' : hm < 840 ? (v2 ? '70%' : '80%') + '（11:00–14:00）' : hm < 960 ? '60%（14:00–16:00）' : '50%（16:00–18:00）';
        }

            if (!x) return '';

            return `<div class="py-2 border-b border-slate-700/50"><div class="flex justify-between"><span class="text-slate-300">${label}</span><span class="font-mono ${c}">${x.saved >= 0 ? '省 ' : '多用 '}${fmt(Math.abs(x.saved), 0)} kWh（${x.pct == null ? '—' : fmt(Math.abs(x.pct), 1) + '%'}）</span></div>
                <div class="text-xs text-slate-400 font-mono">今天到 ${x.upto}：${fmt(x.kwh, 0)} kWh・過去同時段平均 ${fmt(x.base, 0)} kWh・全天平均 ${fmt(x.base_day, 0)}</div></div>`;
        }
        function updateSavings(d) {
            const now = new Date(), m = rt && rt.mag, a = (rt && rt.ac) || {}, g = d.fcu_guard, s = d.savings, t = d.target;
            rtSet('rt-ecofloor', ecoFloor(now));
            { const ev = (m && m.event) || (g && g.event) || ''; rtSet('rt-event', ev ? `<span class="text-amber-300">${ev}</span>${m && m.event_hot != null ? `・活動區熱 ${fmt(m.event_hot * 100, 0)}%` : ''}` : '<span class="text-slate-400">無</span>'); }
            rtSet('rt-ecolimit', fmt(a.mag_limit_pct ?? (m && m.limit), 0));
            const fl = (m && m.floors) || (d.mag_ctl && d.mag_ctl.floors) || {};
            rtSet('rt-floors', Object.keys(fl).length ? Object.entries(fl).map(([k, v]) => { const p = (v.hot || 0) * 100, lim = k === '4F' ? 40 : 25;
                return `<div class="py-0.5"><div class="flex justify-between"><span class="text-slate-300">${k}（${v.n} 台運轉）</span><span class="font-mono ${p >= lim ? 'text-red-400' : p >= 15 ? 'text-amber-300' : 'text-emerald-400'}">${fmt(p, 0)}%</span></div>
                <div class="w-full h-1.5 bg-slate-700 rounded-full overflow-hidden"><div class="h-1.5 ${p >= lim ? 'bg-red-500' : 'bg-sky-400'} rounded-full" style="width:${Math.min(100, p * 2)}%"></div></div></div>`; }).join('')
                + '<p class="text-xs text-slate-500 mt-1">超過 25%（4 樓 40%）每 10 分鐘上限 +10%；低於 15%（4 樓 30%）才往下降</p>' : '<span class="text-slate-400">沒有樓層資料</span>');
            if (!g) rtSet('rt-guard', '<span class="text-slate-400">讀不到 fcu_guard_status.json</span>');
            else {
                const acts = g.actions || [];
                rtSet('rt-guard', `<div class="flex justify-between"><span class="text-slate-300">最近一次 ${(g.time || '').slice(11, 16)}（${g.mode === 'LIVE' ? '實際寫入' : '試跑'}）</span><span class="font-mono text-white">${g.running}／${g.units} 台運轉</span></div>
                    <div class="flex justify-between"><span class="text-slate-300">調回 24°C／下班關機</span><span class="font-mono text-white">${g.setT_fix}／${g.after_off} 台</span></div>
                    ${g.note ? `<div class="text-amber-300 text-xs">${g.note}</div>` : ''}
                    ${acts.length ? `<div class="text-xs text-slate-400 mt-1 max-h-24 overflow-y-auto font-mono">${acts.slice(0, 20).join('<br>').replace(/setT25|setT_floor/g, '調回24°C').replace(/\boff\b/g, '下班關機')}</div>` : ''}`);
            }
            if (!s) { rtSet('rt-sav', '<span class="text-slate-400">沒有基準資料（data/savings_baseline.json）</span>'); rtSet('rt-sav-note', ''); }
            else {
                rtSet('rt-sav', savRow('磁浮主機 EACMP-1', s.mag) + savRow('園區總表', s.main));
                rtSet('rt-sav-note', `比較基準：自動控制前手動操作的 ${s.base_days} 個${s.day_type === 'weekday' ? '平日' : '假日'}（10/16–11/05）同時段平均。未做天氣修正，天熱或活動多會偏高。`);
            }
            if (!t) { rtSet('rt-tgt', '<span class="text-slate-400">沒有目標設定（data/target.json）</span>'); rtSet('rt-tgt-note', ''); }
            else {
                rtSet('rt-tgt-pct', `${t.target_pct}%`);
                const ok = t.proj_meter <= t.cap_meter, yc = t.proj_year_pct <= t.target_pct ? 'text-emerald-400' : 'text-red-400';
                const row = (l, v) => `<div class="flex justify-between py-1 border-b border-slate-700/50"><span class="text-slate-300">${l}</span><span class="font-mono text-white">${v}</span></div>`;
                rtSet('rt-tgt', `<p class="text-slate-400 text-xs">全年推估</p><p class="text-3xl font-bold font-mono ${yc}">${t.proj_year_pct > 0 ? '+' : ''}${fmt(t.proj_year_pct, 2)}%<span class="text-sm text-slate-400 ml-2">目標 ${t.target_pct}%</span></p>

                    ${row(`${t.month.slice(5)} 月至今（${t.days_done} 天＋今天）`, `${fmt(t.mtd_kwh, 0)} kWh`)}
                    ${row('本月電表上限（達標）', `${fmt(t.cap_meter, 0)} kWh`)}
                    ${row('照目前用量推估本月', `<span class="${ok ? 'text-emerald-400' : 'text-red-400'}">${fmt(t.proj_meter, 0)} kWh</span>`)}
                    ${t.per_cap_prev ? row(`人均用電（去年 ${t.people_prev} 人→今年平均 ${fmt(t.people_avg, 0)} 人）`, `${fmt(t.per_cap_prev, 0)} → <span class="text-emerald-400">${fmt(t.per_cap_proj, 0)}</span> 度/人（${t.per_cap_pct > 0 ? '+' : ''}${fmt(t.per_cap_pct, 1)}%）`) : ''}
                    ${row('平日平均／假日平均', `${fmt(t.avg_weekday, 0)}／${fmt(t.avg_weekend, 0)} kWh`)}
                    ${row(`${+t.month.slice(5)} 月剩下 ${t.rem_weekdays + t.rem_weekends} 天（計入 ${+t.month.slice(5) % 12 + 1} 月帳單）每天需壓在`, t.need_per_day == null ? '—' : `<span class="${t.need_per_day < (t.avg_weekday || 0) * 0.85 ? 'text-red-400' : 'text-white'}">${fmt(t.need_per_day, 0)} kWh</span>`)}`);
                rtSet('rt-tgt-note', `去年 FY114 全年 ${fmt(t.fy_prev_total, 0)} 度，${t.target_pct}% 後今年上限 ${fmt(t.fy_prev_total * (1 + t.target_pct / 100), 0)} 度。1–11 月帳單已用 ${fmt(t.bill_ytd, 0)} 度，12 月帳單（約 11 月用電）需 ≤ ${fmt(t.cap_bill, 0)} 度；去年同月 ${fmt(t.bill_last_year, 0)} 度。電表換算帳單 ×1.0203。`);
            }
        }

        function updateFcu(d, chart) {
            const f = d.fcu;
            if (!f) { rtSet('rt-fcunote', '<span class="text-amber-300">還沒有送風機資料（空調監控主機每 5 分鐘記錄一次）</span>'); return; }
            rtSet('rt-oat', fmt(f.oat_c, 1)); rtSet('rt-oah', fmt(f.oah_pct, 0));
            rtSet('rt-fcuon', `${f.on}／${f.n} 台`); rtSet('rt-tin', fmt(f.room_t_on_c, 1)); rtSet('rt-tset', fmt(f.set_t_on_c, 1));
            rtSet('rt-fcunote', f.age_min > 15 ? `<span class="text-amber-300">送風機資料 ${f.age_min} 分鐘沒更新</span>` : `<span class="text-slate-500">資料時間 ${f.time.slice(6)}・外氣取 ${f.oat_sensors} 個 AHU 感測器的中位數</span>`);
            const sr = f.series || {}, ac = (d.ac && d.ac.series) || {};
            const magAt = {}; (ac.times || []).forEach((t, i) => magAt[t] = ac.mag_pct[i]);
            chart.data.labels = sr.times || [];
            chart.data.datasets[0].data = sr.oat_c || [];
            chart.data.datasets[1].data = sr.fcu_on || [];
            chart.data.datasets[2].data = (sr.times || []).map(t => magAt[t] ?? null);
            chart.update('none');
            const tb = document.getElementById('rt-fcugroups');
            if (tb) tb.innerHTML = Object.entries(f.groups || {}).map(([g, [on, n, t, st]]) => `<tr class="border-b border-slate-800"><td class="py-1.5 text-slate-200">${g}</td><td class="py-1.5 text-right font-mono ${on ? 'text-sky-300' : 'text-slate-500'}">${on}／${n}</td><td class="py-1.5 text-right font-mono text-white">${fmt(t, 1)}°C</td><td class="py-1.5 text-right font-mono text-slate-300">${st == null ? '—' : fmt(st, 1) + '°C'}</td></tr>`).join('');
        }

        function renderLive(container) {
            const d = liveData;

                return;
            }
            const margin = (d.last15_kw === null) ? null : d.limit_kw - d.last15_kw;
            const pct = (d.last15_kw === null) ? 0 : Math.min(100, d.last15_kw / d.limit_kw * 100);
            const barColor = pct >= 95 ? 'bg-red-500' : pct >= 85 ? 'bg-amber-400' : 'bg-emerald-400';
            const plant = Object.entries(d.plant_now || {}).filter(([, v]) => v >= 0.5);
            container.innerHTML = `
            <div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">

                ${tile('最近 15 分鐘需量', fmt(d.last15_kw), 'kW', `${d.period}契約 ${fmt(d.limit_kw)} kW，餘裕 <b class="${margin !== null && margin < 30 ? 'text-red-400' : 'text-emerald-400'}">${fmt(margin)} kW</b>`, 'border-l-emerald-400')}
                ${tile('今日最高需量', fmt(d.today_peak_kw), 'kW', d.today_peak_at ? `發生於 ${d.today_peak_at}` : '', 'border-l-amber-400')}

            </div>
            <div class="col-span-full glass-card p-5">
                <div class="flex justify-between text-sm mb-2"><span class="text-slate-300">契約容量使用率（${d.period}）</span><span class="font-mono text-white">${pct.toFixed(0)}%</span></div>
                <div class="w-full h-3 bg-slate-700 rounded-full overflow-hidden"><div class="${barColor} h-3 rounded-full" style="width:${pct}%"></div></div>
            </div>
            ${pvSection(d)}
            ${usageSection(d)}
            <div class="col-span-full glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-chart-line mr-2 text-blue-400"></i>今日 15 分鐘需量</h3>
                <p class="text-xs text-slate-400 mb-3">藍線：總表實測（向台電購電）；黃色虛線：預測系統的逐時預測；綠色：太陽能發電；紅線：當時段契約上限</p>
                <div class="h-72"><canvas id="liveTotal"></canvas></div>
            </div>
            <div class="col-span-full grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-3"><i class="fa-solid fa-snowflake mr-2 text-blue-400"></i>空調主機房</h3>
                ${plant.length ? plant.map(([k, v]) => `<div class="flex justify-between text-sm py-1 border-b border-slate-700/50"><span class="text-slate-300">${k}</span><span class="font-mono text-white">${fmt(v, 1)} kW</span></div>`).join('') : '<p class="text-slate-500 text-sm">目前主機與泵浦都未運轉</p>'}
                <p class="text-xs text-slate-500 mt-3">只列運轉中的設備（最近 15 分鐘平均）</p>
                ${plantOps(d)}
            </div>
            <div class="glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-3"><i class="fa-solid fa-layer-group mr-2 text-amber-400"></i>各樓層配電盤</h3><p class="text-xs text-slate-400 -mt-2 mb-2">B1 空調主機房＝低壓總盤 ACB2-1 饋線（磁浮、泵浦、冷卻水塔）；B1 其他＝B1 一般分路</p>
                <div class="h-64"><canvas id="liveFloors"></canvas></div>
            </div>
            <div class="glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-3"><i class="fa-solid fa-chart-pie mr-2 text-emerald-400"></i>用電組成（最近 15 分鐘）</h3>
                <div class="h-64"><canvas id="liveCats"></canvas></div>
                <p class="text-xs text-slate-500 mt-2">樓層盤依盤名分類：L 照明、R 插座、P 動力、SP 空調箱。</p>

        // 太陽能：T-REC 機器人寫入的試算表，4 支電表的累計度數差（太陽能全部在總表後面自用）
        function plantOps(d) {
            const m = d.mag_today;
            const runs = d.ice_runs || [];
            const mag = m ? `<div class="flex justify-between text-sm py-1"><span class="text-slate-300">磁浮 CHU-2 今日</span><span class="font-mono text-white">運轉 ${fmt(m.run_hours, 1)} h・最高 ${fmt(m.max_kw, 0)} kW・${fmt(m.kwh, 0)} kWh</span></div>` : '';
            const ice = runs.length
                ? runs.map(r => `<div class="flex justify-between text-sm py-1"><span class="text-slate-300">製冰 ${r.start}–${r.end.slice(6)}</span><span class="font-mono text-white">${fmt(r.hours, 2)} h・${fmt(r.kwh, 0)} kWh</span></div>`).join('')
                : '<div class="flex justify-between text-sm py-1"><span class="text-slate-300">製冰（BCU-1）</span><span class="text-slate-400">昨晚到現在沒有製冰</span></div>';
            return `<div class="mt-4 pt-3 border-t border-slate-600">${acLive(d.ac)}${mag}${ice}<p class="text-xs text-slate-500 mt-2">由主機迴路電表自動判斷：BCU-1 超過 30 kW 算製冰中。</p></div>`;
        }

        // 空調中央監控（空調監控主機每分鐘唯讀記錄）：冰桶液位、磁浮負載 %
        function acLive(ac) {
            if (!ac) return '';
            const L = ac.latest || {};
            const row = (k, v) => `<div class="flex justify-between text-sm py-1"><span class="text-slate-300">${k}</span><span class="font-mono text-white">${v}</span></div>`;
            const stale = ac.age_min != null && ac.age_min > 30;
            return `<div class="mb-2 pb-2 border-b border-slate-700">
                <p class="text-xs text-slate-400 mb-1">空調中央監控 ${ac.time}${stale ? '<span class="text-amber-300">（超過 30 分鐘沒有新資料，請確認空調監控主機的 WindowViewer 有開著）</span>' : ''}</p>
                ${row('冰桶液位 01／02', `${fmt(L.ice01_pct, 1)}%／${fmt(L.ice02_pct, 1)}%`)}
                ${row('磁浮 CHU-2 負載', `${fmt(ac.mag_pct, 0)}%（限制 ${fmt(L.mag_limit_pct, 0)}%）・${fmt(ac.mag_kw, 0)} kW`)}
                ${row('冰水出／回水', `${fmt(L.mag_chws_c, 1)}／${fmt(L.mag_chwr_c, 1)} °C・流量 ${fmt(L.flow_m3h, 0)} m³/h`)}
            </div>`;
        }

        function pvSection(d) {
            const pv = d.pv;
            if (!pv) return '';
            const grid = d.last15_kw, solar = pv.now_kw;
            const share = (grid != null && solar != null && grid + solar > 0) ? solar / (grid + solar) * 100 : null;
            const stale = pv.updated && (new Date(d.updated.replace(' ', 'T') + ':00+08:00') - new Date(pv.updated.replace(' ', 'T') + ':00+08:00')) / 60000 > 60;
            return `<div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                ${tile('太陽能發電', fmt(solar, 1), 'kW', `資料時間 ${pv.updated ? pv.updated.slice(11) : '—'}${stale ? '（超過 1 小時未更新）' : ''}`, 'border-l-yellow-300')}
                ${tile('園區實際用電', grid != null && solar != null ? fmt(grid + solar, 1) : '—', 'kW', '向台電購電＋太陽能自用', 'border-l-sky-300')}
                ${tile('太陽能占比', share != null ? fmt(share, 1) : '—', '%', '最近 15 分鐘', 'border-l-emerald-300')}
                ${tile('今日太陽能發電', fmt(pv.today_kwh, 0), 'kWh', `本月 ${fmt(pv.month_kwh)} kWh`, 'border-l-lime-300')}
            </div>`;

        // 四大用途：依房間迴路表（roomData）把各迴路歸到 空調／動力／照明／插座，同一迴路只算一次
        function usageByCategory() {
            const out = {};
            const seen = new Set();
            roomData.forEach(room => Object.entries(room.circuits).forEach(([cat, cs]) => {
                if (!cs || cs === '-') return;
                out[cat] = out[cat] || { kw: 0, today: 0 };
                cs.split(' / ').forEach(c => {
                    const key = circuitKey(c);
                    if (!key || seen.has(key)) return;
                    seen.add(key);
                    const v = livePowerData[key];
                    if (v) { out[cat].kw += v[0] || 0; out[cat].today += v[1] || 0; }
                });
            }));
            return out;
        }

        function topRooms(type, n = 5) {
            return roomData.filter(r => r.type === type)
                .map(r => ({ room: r, t: roomTotals(r) }))
                .filter(x => x.t)
                .sort((a, b) => b.t.kw - a.t.kw || b.t.today - a.t.today)
                .slice(0, n);
        }

        function rankTable(title, icon, color, rows) {
            const body = rows.length ? rows.map((x, i) => `
                <tr class="border-b border-slate-700/50">
                    <td class="py-2 pr-2 text-slate-500 font-mono">${i + 1}</td>
                    <td class="py-2 pr-3 font-bold text-white whitespace-nowrap">${x.room.room_id}</td>

                    <td class="py-2 pr-3 text-right font-mono text-slate-400 whitespace-nowrap">${x.room.area ? fmt(x.room.area, 1) : '—'}</td>
                    <td class="py-2 text-right font-mono text-white whitespace-nowrap">${fmt(x.t.kw, 1)} kW</td>
                    <td class="py-2 pl-3 text-right font-mono text-sky-300 whitespace-nowrap">${fmt(wPerM2(x.t.kw, x.room.area), 1)}</td>
                    <td class="py-2 pl-3 text-right font-mono text-slate-400 whitespace-nowrap">${fmt(x.t.today, 1)} kWh</td>
                </tr>`).join('') : '<tr><td class="py-3 text-slate-500">各房間資料載入中...</td></tr>';
            return `<div class="glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-3"><i class="${icon} mr-2 ${color}"></i>${title}</h3>
                <table class="w-full text-sm"><thead><tr class="text-xs text-slate-500 text-left">
                    <th class="pb-2">#</th><th class="pb-2">空間</th><th class="pb-2">單位</th><th class="pb-2 text-right">坪</th><th class="pb-2 text-right">目前</th><th class="pb-2 text-right">W/m²</th><th class="pb-2 text-right">今日</th>
                </tr></thead><tbody>${body}</tbody></table></div>`;
        }

        function usageSection(d) {
            if (!roomsUpdated) return '';
            const u = usageByCategory();
            const plantKw = lastOf(d.feeders)['空調主機房'];
            const g = k => u[k] || { kw: 0, today: 0 };
            const plantNote = plantKw !== undefined ? `；另有空調主機房 ${fmt(plantKw)} kW` : '';
            return `
            <div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                ${tile('<i class="fa-solid fa-snowflake mr-1 text-sky-400"></i>空調總用電', fmt(g('空調').kw, 1), 'kW', `今日 ${fmt(g('空調').today)} kWh${plantNote}`, 'border-l-sky-400')}
                ${tile('<i class="fa-solid fa-gears mr-1 text-red-400"></i>動力總用電', fmt(g('動力').kw, 1), 'kW', `今日 ${fmt(g('動力').today)} kWh`, 'border-l-red-400')}
                ${tile('<i class="fa-regular fa-lightbulb mr-1 text-yellow-300"></i>照明總用電', fmt(g('照明').kw, 1), 'kW', `今日 ${fmt(g('照明').today)} kWh`, 'border-l-yellow-300')}
                ${tile('<i class="fa-solid fa-plug mr-1 text-amber-400"></i>插座總用電', fmt(g('插座').kw, 1), 'kW', `今日 ${fmt(g('插座').today)} kWh`, 'border-l-amber-400')}
            </div>
            <p class="col-span-full text-xs text-slate-500 -mt-3">依房間迴路表加總各空間的迴路（最近 15 分鐘平均），同一迴路只算一次；資料時間 ${roomsUpdated}</p>
            <div class="col-span-full grid grid-cols-1 lg:grid-cols-2 gap-6">
                ${rankTable('辦公室用電前五名', 'fa-solid fa-briefcase', 'text-emerald-400', topRooms('辦公室'))}
                ${rankTable('實驗室用電前五名', 'fa-solid fa-flask', 'text-blue-400', topRooms('實驗室'))}
                ${rankTable('公設機房用電前五名', 'fa-solid fa-fan', 'text-orange-400', topRooms('機房'))}
            </div>`;
        }

        // ==========================================
        // 能管分析：用坪數算用電密度、找出異常與下班待機用電
        // ==========================================
        // 園區空間概況（2026/11/2 空間清單；規劃面積＝法人空間＋廠商空間，不含公共空間）
        const PARK_SPACE = {
            date: '2026/11/2', planned: 3536.91, plannedSplit: { '法人空間': 1920.58, '廠商空間': 1616.33 },
            // 清單原分 工研院 1993.70／廠商 1856.04／資策會 84.39；用電大的廠商環電（657.34）、奧鋼聯（121.61）單獨列，資策會量體小併入其他廠商
            used: { '工研院': 1993.70, '環電': 657.34, '奧鋼聯': 121.61, '其他廠商': 1856.04 - 657.34 - 121.61 + 84.39 }, units: { '研究法人': 2, '廠商': 25 }
        };
        const orgOf = r => (r.org === '中創' ? '工研院'
            : (r.company === '環電' || r.company === '奧鋼聯') ? r.company
            : (r.org === '廠商' || r.org === '資策會') ? '其他廠商' : r.org);

        function occupancySection(occ) {
            const P = PARK_SPACE;
            const used = Object.values(P.used).reduce((a, b) => a + b, 0);
            const nUnits = P.units['研究法人'] + P.units['廠商'];
            const kwAll = occ.reduce((s, x) => s + x.t.kw, 0);
            const rows = Object.keys(P.used).map(o => {
                const a = occ.filter(x => orgOf(x.room) === o);
                const kw = a.reduce((s, x) => s + x.t.kw, 0), month = a.reduce((s, x) => s + x.t.month, 0);
                const area = a.reduce((s, x) => s + x.room.area, 0);
                return [o, `${fmt(P.used[o], 1)}`, `${fmt(P.used[o] / used * 100, 1)}%`, fmt(kw, 1), kwAll ? `${fmt(kw / kwAll * 100, 1)}%` : '—', fmt(wPerM2(kw, area), 1), fmt(kwhPerPing(month, area), 2)];
            });
            return `
            <div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                ${tile('進駐單位', nUnits, '家', `研究法人 ${P.units['研究法人']}、廠商 ${P.units['廠商']}`, 'border-l-indigo-400')}
                ${tile('規劃出租面積', fmt(P.planned, 1), '坪', `法人 ${fmt(P.plannedSplit['法人空間'], 1)}＋廠商 ${fmt(P.plannedSplit['廠商空間'], 1)}`, 'border-l-slate-400')}
                ${tile('實際使用面積', fmt(used, 1), '坪', `工研院 ${fmt(P.used['工研院'], 0)}、環電 ${fmt(P.used['環電'], 0)}、奧鋼聯 ${fmt(P.used['奧鋼聯'], 0)}、其他廠商 ${fmt(P.used['其他廠商'], 0)}`, 'border-l-cyan-400')}
                ${tile('進駐率', fmt(used / P.planned * 100), '%', '實際使用 ÷ 規劃出租面積；超過 100% 是因為部分原本的公共或大型空間（例如溫室中心、儲藏室）已改為辦公室或實驗室出租使用', 'border-l-emerald-400')}
            </div>
            <div class="col-span-full">${emTable('面積占比與用電占比', 'fa-solid fa-scale-balanced', 'text-indigo-300',
                `面積依 ${P.date} 空間清單；用電為各類別房間迴路最近 15 分鐘合計；資策會併入其他廠商。用電占比明顯高於面積占比的類別，就是節能溝通的優先對象。`,
                ['使用類別', '面積（坪）', '面積占比', '目前 kW', '用電占比', 'W/m²', '本月 kWh/坪'], rows, '')}</div>`;
        }

        function historySection() {
            if (!monthly) return '';
            const P = monthly.park, m = monthly.months;
            const k = last12(P.kwh), f = last12(P.fee);
            const years = [...new Set(m.map(x => x.slice(0, 4)))];
            const lastMonth = +m[m.length - 1].split('/')[1];
            // 各年同期（1 月到最新月份）比較
            const ytd = (key, y) => sum(m.map((x, i) => (x.startsWith(y + '/') && +x.split('/')[1] <= lastMonth) ? P[key][i] : 0));
            const rows = years.map(y => [y, fmt(ytd('kwh', y)), fmt(ytd('fee', y)), fmt(ytd('fee', y) / ytd('kwh', y), 2), fmt(ytd('ac', y)), fmt(ytd('holiday_ac', y)), fmt(ytd('air', y)), `${fmt(ytd('public', y) / ytd('kwh', y) * 100)}%`]);
            return `
            <div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                ${tile('近 12 個月用電', fmt(k.cur / 1000, 1), '千度', k.chg === null ? '' : `較前 12 個月 ${k.chg > 0 ? '+' : ''}${fmt(k.chg, 1)}%`, 'border-l-sky-400')}
                ${tile('近 12 個月電費', fmt(f.cur / 1e4), '萬元', f.chg === null ? '' : `較前 12 個月 ${f.chg > 0 ? '+' : ''}${fmt(f.chg, 1)}%`, 'border-l-amber-400')}
                ${tile('平均電價', fmt(f.cur / k.cur, 2), '元/度', `${m[m.length - 13]}–${m[m.length - 1]}`, 'border-l-red-400')}
                ${tile('公共用電占比', fmt(sum(P.public.slice(-12)) / k.cur * 100), '%', '機房、公設、梯廳等，不含各空間空調分攤', 'border-l-slate-400')}
            </div>
            <div class="col-span-full glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-chart-column mr-2 text-sky-400"></i>園區每月用電與電價</h3>
                <p class="text-xs text-slate-400 mb-3">${monthly.source}；${m[0]}–${m[m.length - 1]}。長條：進駐與公共用電；線：平均每度電費。</p>
                <div class="h-72"><canvas id="emMonthly"></canvas></div>
            </div>
            <div class="col-span-full">${emTable(`歷年同期比較（1–${lastMonth} 月）`, 'fa-solid fa-calendar', 'text-amber-400', '假日空調申請與空壓機逐年增加，是目前最值得管理的兩項。',
                ['年度', '用電（度）', '電費（元）', '元/度', '空調分攤', '假日空調', '空壓機', '公共占比'], rows, '')}</div>`;
        }

        function billSection() {
            if (!bill) return '';
            const m = bill.months, n = m.length, last = n - 1;
            const D = bill.demand, C = bill.contract;
            const pen12 = sum(bill.penalty.slice(-12)), penPrev = sum(bill.penalty.slice(-24, -12));
            const yr = m[last].slice(0, 4);
            const maxOf = p => Math.max(0, ...m.map((x, i) => x.startsWith(yr) ? (D[p][i] || 0) : 0));
            const over = p => maxOf(p) > C[p];
            const dTile = p => `<span class="${over(p) ? 'text-red-400' : 'text-emerald-300'}">${p} ${fmt(maxOf(p))}</span><span class="text-slate-500">/${fmt(C[p])}</span>`;
            const fyLast = (bill.fy_months || []).includes(m[last]);
            const issues = bill.issues.slice().reverse();
            const pens = m.map((x, i) => [x, bill.penalty[i]]).filter(x => x[1] > 0).reverse()
                .map(([x, p]) => { const i = m.indexOf(x); return [x, fmt(p), Object.keys(D).filter(k => D[k][i] > C[k]).map(k => `${k} ${fmt(D[k][i])}`).join('、') || '—']; });
            return `
            <div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                ${tile(`台電帳單 ${m[last]}`, fmt(bill.kwh[last]), '度', `電費 ${fmt(bill.fee[last])} 元，${fmt(bill.fee[last] / bill.kwh[last], 2)} 元/度${fyLast ? `，最高需量 ${fmt(bill.max_kw[last])} kW（能源統計表先填）` : ''}`, 'border-l-sky-400')}
                ${tile('太陽能自用', fmt(bill.pv[last]), '度', `占總用電 ${fmt(bill.pv[last] / (bill.kwh[last] + bill.pv[last]) * 100, 1)}%`, 'border-l-yellow-300')}
                ${tile('近 12 期超約罰款', fmt(pen12), '元', `前 12 期 ${fmt(penPrev)} 元`, pen12 > 0 ? 'border-l-red-400' : 'border-l-emerald-400')}
                <div class="glass-card px-5 py-4 border-l-4 border-l-violet-400"><p class="text-slate-400 text-xs mb-1">${yr} 年各時段最高需量／契約（kW）</p>
                    <p class="font-mono text-sm leading-6">${['尖峰', '半尖峰', '離峰'].map(dTile).join('<br>')}</p></div>
            </div>
            <div class="col-span-full glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-file-invoice-dollar mr-2 text-violet-300"></i>台電帳單：各時段最高需量與契約容量</h3>
                <p class="text-xs text-slate-400 mb-3">${bill.source}。虛線是現行契約（尖峰 ${C['尖峰']}、半尖峰 ${C['半尖峰']}、週六半尖峰與離峰 ${C['離峰']} kW）。台電電表比 BMS 畫面高約 10 kW。</p>
                <div class="h-72"><canvas id="emBill"></canvas></div>
            </div>
            <div class="col-span-full grid grid-cols-1 xl:grid-cols-2 gap-6">
                ${emTable('超約罰款紀錄', 'fa-solid fa-triangle-exclamation', 'text-red-400', '帳單上的超約附加費，以及當月超過契約的時段。',
                    ['帳單月份', '罰款（元）', '超過現行契約的時段'], pens, '沒有罰款紀錄')}
                ${emTable('帳單填寫檢查', 'fa-solid fa-list-check', 'text-amber-300', `自動檢查同仁填寫的數值（${bill.issues.length ? '紅色請修正，黃色請確認' : '目前沒有問題'}）：單價異常、太陽能和上月相同、超約卻沒填罰款、欄位空白或填 0，並和「能源統計表」對帳。`,
                    ['帳單月份', '檢查結果'], issues.map(x => [x.month, `<span class="${x.level === 'error' ? 'text-red-400' : 'text-amber-300'} whitespace-normal">${x.msg}</span>`]), '沒有發現問題')}
            </div>`;
        }

        function emRooms() {
            return roomData.filter(r => r.area > 0 && r.building !== 'Public')
                .map(r => ({ room: r, t: roomTotals(r) }))
                .filter(x => x.t)
                .map(x => ({ ...x, d: wPerM2(x.t.kw, x.room.area), m: kwhPerPing(x.t.month, x.room.area) }));
        }

        function emTable(title, icon, color, note, head, rows, empty) {
            return `<div class="glass-card p-5">
                <h3 class="text-lg font-bold text-white mb-1"><i class="${icon} mr-2 ${color}"></i>${title}</h3>
                <p class="text-xs text-slate-400 mb-3">${note}</p>
                <div class="overflow-x-auto max-h-[28rem] overflow-y-auto"><table class="w-full text-sm"><thead class="sticky top-0 bg-slate-900/95"><tr class="text-xs text-slate-500 text-left">${head.map((h, i) => `<th class="pb-2 pr-3 ${i > 1 ? 'text-right' : ''} whitespace-nowrap">${h}</th>`).join('')}</tr></thead>
                <tbody>${rows.length ? rows.map(r => `<tr class="border-b border-slate-700/50">${r.map((c, i) => `<td class="py-1.5 pr-3 ${i > 1 ? 'text-right font-mono' : ''} ${i === 0 ? 'font-bold text-white' : 'text-slate-300'} whitespace-nowrap">${c}</td>`).join('')}</tr>`).join('') : `<tr><td class="py-3 text-slate-500" colspan="${head.length}">${empty}</td></tr>`}</tbody></table></div></div>`;
        }

        // 迴路資料檢查：找出對照表可能有誤、或電表沒有讀值的地方
        function auditSection() {
            const idx = circuitIndex();
            const full = Object.values(livePowerData).some(v => v && v[3] != null);   // 至少有一整晚資料才判斷「沒讀值」
            const rows = [];
            const users = p => [...(idx.users[p] || [])];
            const list = a => a.slice(0, 4).join('、') + (a.length > 4 ? ` 等 ${a.length} 處` : '');
            // 1. 沒有分路電表
            Object.keys(NO_BRANCH).filter(p => idx.panels.has(p)).forEach(p => {
                const n = [...idx.all].filter(k => panelOf(k) === p).length;
                rows.push([p.replace(/_/g, '-'), '<span class="text-amber-300">無分路電表</span>', n, list(users(p))]);
            });
            // 2. 表上有、監控電腦沒有
            const missing = [...idx.all].filter(k => !NO_BRANCH[panelOf(k)] && !livePowerData[k]);
            [...new Set(missing.map(panelOf))].forEach(p => {
                const ks = missing.filter(k => panelOf(k) === p);
                rows.push([p.replace(/_/g, '-'), '<span class="text-red-400">找不到電表</span>', ks.length, list(users(p))]);
            });
            // 3. 整盤本月都是 0
            if (full) [...idx.panels].filter(p => !NO_BRANCH[p]).forEach(p => {
                const ks = [...idx.all].filter(k => panelOf(k) === p && livePowerData[k]);
                if (ks.length && ks.every(k => !(livePowerData[k][2] > 0))) {
                    const all42 = Object.keys(livePowerData).filter(k => panelOf(k) === p);
                    const dead = all42.every(k => !(livePowerData[k][2] > 0));
                    rows.push([p.replace(/_/g, '-'), `<span class="text-orange-300">${dead ? '整盤都沒讀值' : '對應迴路都是 0'}</span>`, ks.length, list(users(p))]);
                }
            });
            // 4. 帳單有用電、迴路卻是 0
            const billRows = full && monthly ? roomData.map(r => {
                const v = monthly.rooms[r.room_id]; const last = v ? v[v.length - 1] : null;
                const t = roomTotals(r);
                return { r, last, m: t ? t.month : null };
            }).filter(x => x.last >= 1000 && x.m !== null && x.m < 1).sort((a, b) => b.last - a.last)
              .map(x => [x.r.room_id, x.r.company || '—', fmt(x.last), fmt(x.m, 1)]) : [];
            return `<div class="col-span-full grid grid-cols-1 xl:grid-cols-2 gap-6">
                ${emTable('迴路對照檢查', 'fa-solid fa-list-check', 'text-amber-300',
                    `網站共對應 ${fmt(idx.panels.size)} 個配電盤、${fmt(idx.all.size)} 個迴路，逐一和監控電腦的電表標籤比對。無分路電表：只有整盤總表，房間卡片改顯示整盤用電並註明共用。找不到電表：盤名或迴路編號要確認。整盤都沒讀值：電表通訊或 InTouch 標籤可能沒更新。對應迴路都是 0：同盤其他迴路有讀值，可能迴路編號對錯。${full ? '' : '「沒讀值」要等累積一整晚的資料後才開始判斷。'}`,
                    ['盤', '狀況', '迴路', '使用空間'], rows, '全部迴路都有對應的電表')}
                ${emTable('帳單有用電、迴路卻是 0', 'fa-solid fa-scale-unbalanced', 'text-red-400',
                    `上個月分攤表超過 1,000 度，但本月迴路累計不到 1 度的空間，最可能是迴路對照錯誤。${full ? '' : '資料累積一整晚後開始判斷。'}`,
                    ['空間', '單位', `${monthly ? monthly.months[monthly.months.length - 1] : ''} 度`, '本月迴路 kWh'], billRows, full ? '沒有發現' : '資料累積中')}
            </div>`;
        }

        function renderEM(container) {
            if (!roomsUpdated) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-16"><i class="fa-solid fa-spinner fa-spin text-4xl mb-4 block"></i>各房間用電資料載入中...</div>`;
                return;
            }
            const rooms = emRooms();
            const occ = rooms.filter(x => x.room.type !== '未進駐');
            const vacant = rooms.filter(x => x.room.type === '未進駐');
            const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
            const areaAll = sum(occ, x => x.room.area), kwAll = sum(occ, x => x.t.kw), monthAll = sum(occ, x => x.t.month);
            const byType = t => occ.filter(x => x.room.type === t);
            const typeD = t => { const a = byType(t); return wPerM2(sum(a, x => x.t.kw), sum(a, x => x.room.area)); };
            const med = { '辦公室': median(byType('辦公室').map(x => x.d)), '實驗室': median(byType('實驗室').map(x => x.d)) };

            // 依單位彙總
            const units = {};
            occ.forEach(x => x.room.company.split('、').map((u, i, arr) => (i && arr[0].startsWith('中分院') && !u.startsWith('中分院')) ? '中分院' + u : u).forEach((u, _, arr) => {
                const w = 1 / arr.length;   // 多個單位共用一間時平均分攤
                const o = units[u] = units[u] || { n: 0, area: 0, kw: 0, month: 0, night: 0, hasNight: false };
                o.n++; o.area += x.room.area * w; o.kw += x.t.kw * w; o.month += x.t.month * w;
                if (x.t.night != null) { o.night += x.t.night * w; o.hasNight = true; }
            }));
            const unitRows = Object.entries(units).filter(([, o]) => o.area > 0)
                .sort((a, b) => kwhPerPing(b[1].month, b[1].area) - kwhPerPing(a[1].month, a[1].area))
                .map(([u, o]) => [u, o.n, fmt(o.area, 1), fmt(o.kw, 1), fmt(wPerM2(o.kw, o.area), 1), fmt(o.month), fmt(kwhPerPing(o.month, o.area), 2), o.hasNight ? fmt(o.night, 2) : '—']);

            // 密度偏高：超過同類型中位數 2 倍，且至少 1 kW
            const high = occ.filter(x => med[x.room.type] && x.d > 2 * med[x.room.type] && x.t.kw >= 1)
                .sort((a, b) => b.d / med[b.room.type] - a.d / med[a.room.type])
                .map(x => [x.room.room_id, x.room.company, x.room.type, fmt(x.room.area, 1), fmt(x.t.kw, 1), fmt(x.d, 1), `${fmt(x.d / med[x.room.type], 1)} 倍`]);

            // 下班待機：夜間 00:00–06:00 平均
            const nightRooms = occ.filter(x => x.t.night != null && x.t.night >= 0.1).sort((a, b) => b.t.night - a.t.night);
            const nightRows = nightRooms.slice(0, 15).map(x => [x.room.room_id, x.room.company, fmt(x.t.night, 2),
                fmt(wPerM2(x.t.night, x.room.area), 1), x.t.work ? `${fmt(x.t.night / x.t.work * 100)}%` : '—', fmt(x.t.night * OFF_HOURS)]);
            const nightAll = sum(occ, x => x.t.night);
            const hasNight = occ.some(x => x.t.night != null);

            const vacantRows = vacant.filter(x => x.t.kw >= 0.1 || x.t.today >= 1)
                .map(x => [x.room.room_id, '空置', fmt(x.room.area, 1), fmt(x.t.kw, 2), fmt(x.t.today, 1)]);

            container.innerHTML = `
            ${occupancySection(occ)}
            ${auditSection()}
            ${historySection()}
            ${billSection()}
            <div class="col-span-full grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                ${tile('有迴路資料的進駐面積', fmt(areaAll), '坪', `${occ.length} 間有迴路資料；空置 ${fmt(sum(vacant, x => x.room.area))} 坪`, 'border-l-blue-400')}
                ${tile('進駐空間即時用電', fmt(kwAll, 1), 'kW', `平均 ${fmt(wPerM2(kwAll, areaAll), 1)} W/m²；本月 ${fmt(kwhPerPing(monthAll, areaAll), 2)} kWh/坪`, 'border-l-emerald-400')}
                ${tile('辦公室用電密度', fmt(typeD('辦公室'), 1), 'W/m²', `中位數 ${fmt(med['辦公室'], 1)} W/m²（${byType('辦公室').length} 間）`, 'border-l-emerald-300')}
                ${tile('實驗室用電密度', fmt(typeD('實驗室'), 1), 'W/m²', `中位數 ${fmt(med['實驗室'], 1)} W/m²（${byType('實驗室').length} 間）`, 'border-l-sky-400')}
            </div>
            <p class="col-span-full text-xs text-slate-500 -mt-3">用電密度＝房間迴路最近 15 分鐘平均 kW ÷ 面積（1 坪＝3.3058 m²）；只含房間迴路（照明、插座、動力、空調箱），不含冰水主機分攤。資料時間 ${roomsUpdated}，本月自開始記錄日起算。</p>
            <div class="col-span-full grid grid-cols-1 xl:grid-cols-2 gap-6">
                ${emTable('各單位每坪用電', 'fa-solid fa-ranking-star', 'text-amber-400', '依本月每坪用電量由高到低；多單位共用的空間平均分攤。這是對廠商溝通節電最直接的指標。',
                    ['單位', '間', '坪', '目前 kW', 'W/m²', '本月 kWh', 'kWh/坪', '夜間 kW'], unitRows, '尚無資料')}
                <div class="glass-card p-5">
                    <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-braille mr-2 text-sky-400"></i>面積與用電分布</h3>
                    <p class="text-xs text-slate-400 mb-3">每點一間；越靠左上代表小空間用很多電。滑鼠移上去看房號。</p>
                    <div class="h-96"><canvas id="emScatter"></canvas></div>
                </div>
            </div>
            <div class="col-span-full grid grid-cols-1 xl:grid-cols-2 gap-6">
                ${emTable('下班待機用電', 'fa-solid fa-moon', 'text-violet-300',
                    hasNight ? `最近一晚 00:00–06:00 平均。全部進駐空間夜間合計 ${fmt(nightAll, 1)} kW，換算每月下班時段約 ${fmt(nightAll * OFF_HOURS)} kWh（以每月 ${OFF_HOURS} 小時下班時間估算）。夜間比例高代表設備沒關。` : '需要一晚 00:00–06:00 的資料，明天早上起自動顯示。',
                    ['空間', '單位', '夜間 kW', 'W/m²', '佔上班', '月估 kWh'], nightRows, '資料累積中')}
                ${emTable('用電密度偏高', 'fa-solid fa-triangle-exclamation', 'text-red-400', `目前用電密度超過同類型中位數 2 倍（辦公室 ${fmt(med['辦公室'], 1)}、實驗室 ${fmt(med['實驗室'], 1)} W/m²），可能是設備密集、或迴路對照有誤，建議現場確認。`,
                    ['空間', '單位', '類型', '坪', 'kW', 'W/m²', '中位數'], high, '目前沒有明顯偏高的空間')}
            </div>
            ${vacantRows.length ? `<div class="col-span-full">${emTable('空置空間仍有用電', 'fa-solid fa-door-open', 'text-amber-400', '登記為空置但迴路仍有讀數，可能是設備未斷電或迴路對照需要更新。', ['空間', '狀態', '坪', '目前 kW', '今日 kWh'], vacantRows, '')}</div>` : ''}`;

            if (monthly && document.getElementById('emMonthly')) {
                const P = monthly.park;
                liveCharts.push(new Chart(document.getElementById('emMonthly'), {
                    data: { labels: monthly.months, datasets: [
                        { type: 'bar', label: '進駐用電', data: P.tenant, backgroundColor: '#38bdf8', stack: 'k', yAxisID: 'y' },
                        { type: 'bar', label: '公共用電', data: P.public, backgroundColor: '#64748b', stack: 'k', yAxisID: 'y' },
                        { type: 'line', label: '元/度', data: P.fee.map((v, i) => P.kwh[i] ? +(v / P.kwh[i]).toFixed(2) : null), borderColor: '#fbbf24', pointRadius: 0, yAxisID: 'y2' }
                    ] },
                    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                        scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 16 } },
                                  y: { stacked: true, title: { display: true, text: '度' }, grid: { color: 'rgba(148,163,184,0.15)' } },
                                  y2: { position: 'right', title: { display: true, text: '元/度' }, grid: { display: false }, min: 0 } } }
                }));
            }
            if (bill && document.getElementById('emBill')) {
                const k = Math.max(0, bill.months.length - 36), lab = bill.months.slice(k);
                const col = { '尖峰': '#f87171', '半尖峰': '#fbbf24', '週六半尖峰': '#a78bfa', '離峰': '#38bdf8' };
                const ds = Object.keys(col).flatMap(p => [
                    { type: 'line', label: p, data: bill.demand[p].slice(k).map(v => v || null), borderColor: col[p], backgroundColor: col[p], pointRadius: 2, spanGaps: true },
                    ...(p === '週六半尖峰' ? [] : [{ type: 'line', label: `${p}契約`, data: lab.map(() => bill.contract[p]), borderColor: col[p], borderDash: [6, 4], borderWidth: 1, pointRadius: 0 }])
                ]);
                const fy = bill.fy_months || [];
                if (fy.length) ds.push({ type: 'line', label: '最高需量（能源統計表，尚未分時段）', data: lab.map((x, i) => fy.includes(x) ? bill.max_kw[k + i] : null), borderColor: '#e2e8f0', backgroundColor: '#e2e8f0', pointRadius: 5, pointStyle: 'rectRot', showLine: false });
                liveCharts.push(new Chart(document.getElementById('emBill'), {
                    data: { labels: lab, datasets: ds },
                    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                        plugins: { legend: { labels: { filter: i => !i.text.endsWith('契約') } } },
                        scales: { x: { grid: { display: false } }, y: { min: 100, title: { display: true, text: 'kW' }, grid: { color: 'rgba(148,163,184,0.15)' } } } }
                }));
            }
            const colors = { '辦公室': '#34d399', '實驗室': '#38bdf8', '未進駐': '#94a3b8' };
            const sets = Object.keys(colors).map(t => ({ label: t, backgroundColor: colors[t],
                data: rooms.filter(x => x.room.type === t).map(x => ({ x: x.room.area, y: +x.t.kw.toFixed(2), id: x.room.room_id, c: x.room.company })) }));
            liveCharts.push(new Chart(document.getElementById('emScatter'), {
                type: 'scatter', data: { datasets: sets },
                options: { responsive: true, maintainAspectRatio: false,
                    plugins: { tooltip: { callbacks: { label: c => `${c.raw.id} ${c.raw.c}：${c.raw.x} 坪、${c.raw.y} kW（${fmt(wPerM2(c.raw.y, c.raw.x), 1)} W/m²）` } } },
                    scales: { x: { type: 'logarithmic', title: { display: true, text: '面積（坪）' }, grid: { color: 'rgba(148,163,184,0.15)' } },
                              y: { title: { display: true, text: '目前用電（kW）' }, grid: { color: 'rgba(148,163,184,0.15)' } } } }
            }));
        }

        function lastOf(series) {
            return Object.fromEntries(Object.entries(series || {}).map(([k, v]) => [k, v[v.length - 1] || 0]));
        }

        function drawLiveCharts(d) {
            Chart.defaults.color = '#cbd5e1';
            const grid = { color: 'rgba(148,163,184,0.15)' };
            // 全日 00:00–23:45 的時間軸
            const labels = Array.from({ length: 96 }, (_, i) => `${String(Math.floor(i / 4)).padStart(2, '0')}:${String(i % 4 * 15).padStart(2, '0')}`);
            const actual = labels.map(t => { const i = d.times.indexOf(t); return i >= 0 ? d.total[i] : null; });
            const fc = labels.map(t => t.endsWith(':00') && d.forecast[t] !== undefined ? d.forecast[t] : null);
            const limitAt = t => {
                const h = +t.slice(0, 2), m = +t.slice(5, 7) || 0;
                const day = new Date(d.updated.slice(0, 10) + 'T12:00:00+08:00');
                const wd = day.getDay(), md = (day.getMonth() + 1) * 100 + day.getDate();
                const summer = md >= 516 && md <= 1015;
                if (wd === 0) return d.limits['離峰'];
                if (wd === 6) return (summer && h >= 9) ? d.limits['週六半尖峰'] : d.limits['離峰'];
                if (summer) return (h >= 16 && h < 22) ? d.limits['尖峰'] : (h >= 9 && h < 24) ? d.limits['半尖峰'] : d.limits['離峰'];
                return ((h >= 6 && h < 11) || (h >= 14 && h < 24)) ? d.limits['半尖峰'] : d.limits['離峰'];
            };
            liveCharts.push(new Chart(document.getElementById('liveTotal'), {
                type: 'line',
                data: { labels, datasets: [
                    { label: '實測', data: actual, borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.15)', fill: true, pointRadius: d.times.length < 8 ? 3 : 0, tension: 0.2 },
                    { label: '預測', data: fc, borderColor: '#fbbf24', borderDash: [6, 4], pointRadius: 2, spanGaps: true },
                    ...(d.pv && d.pv.series ? [{ label: '太陽能', data: labels.map(t => d.pv.series[t] ?? null), borderColor: '#a3e635', backgroundColor: 'rgba(163,230,53,0.15)', fill: true, pointRadius: 0, tension: 0.2 }] : []),
                    { label: '契約上限', data: labels.map(limitAt), borderColor: '#f87171', pointRadius: 0, borderWidth: 1.5, stepped: true }
                ] },
                options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    scales: { x: { grid, ticks: { maxTicksLimit: 12 } }, y: { grid, beginAtZero: true, title: { display: true, text: 'kW' } } } }
            }));
            const floors = { ...lastOf(d.floors) };
            const plantFl = lastOf(d.feeders)['空調主機房'];
            if (plantFl != null) floors['B1 空調主機房'] = plantFl;
            if ('B1' in floors) { floors['B1 其他'] = floors['B1']; delete floors['B1']; }
            const order = ['B1 空調主機房', 'B1 其他', '1F', '2F', '3F', '4F'].filter(k => k in floors);
            liveCharts.push(new Chart(document.getElementById('liveFloors'), {
                type: 'bar',
                data: { labels: order, datasets: [{ label: 'kW', data: order.map(k => floors[k]), backgroundColor: '#fbbf24', borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } },
                    scales: { x: { grid, title: { display: true, text: 'kW（最近 15 分鐘平均）' } }, y: { grid: { display: false } } } }
            }));
            const feeders = lastOf(d.feeders), cats = lastOf(d.cats);
            const parts = { '空調主機房': feeders['空調主機房'] || 0 };
            ['空調箱', '照明', '插座', '動力'].forEach(k => { if (cats[k]) parts[k] = cats[k]; });
            liveCharts.push(new Chart(document.getElementById('liveCats'), {
                type: 'doughnut',
                data: { labels: Object.keys(parts), datasets: [{ data: Object.values(parts).map(v => +v.toFixed(1)), backgroundColor: PALETTE, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '60%',
                    plugins: { legend: { position: 'right', labels: { boxWidth: 10 } },
                        tooltip: { callbacks: { label: c => `${c.label}：${c.parsed} kW` } } } }
            }));
        }

        // 初始化：本機版預設開「即時監控」，雲端版開「即時總覽」
        if (EMS_LOCAL) document.getElementById('tab-RT').classList.remove('hidden');
        switchTab(EMS_LOCAL ? 'RT' : 'Live');
        fetchPowerData();

        // 雲端版每 5 分鐘抓一次；本機版每分鐘（本機每分鐘重算）
        setInterval(fetchPowerData, (EMS_LOCAL ? 1 : 5) * 60 * 1000);
        updateHeader();
        fetchMonthly();
        fetchBill();
        fetchRooms();
        setInterval(fetchRooms, (EMS_LOCAL ? 1 : 5) * 60 * 1000);
        if (EMS_LOCAL) { fetchRT(); setInterval(fetchRT, 5000); }

    </script>
</body>
</html>
